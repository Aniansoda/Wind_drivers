name: build-wind-ko

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # urls 按顺序试，前一个失败换下一个，每个源再重试 3 次。
          # 清华源在 GitHub runner 上经常排队 / TLS 中断（curl 56 GnuTLS），放最后。
          # android.googlesource.com 实测支持按 SHA 取任意 commit，放第一。
          - name: android13-5.10.226
            kernel_version: "5.10.226"
            urls: >-
              https://android.googlesource.com/kernel/common
              https://github.com/aosp-mirror/kernel_common.git
              https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/kernel/common.git
            ref: android13-5.10.226_r00
            config: gki_defconfig
            cc: "LLVM=-14"
            llvmver: "14"
            mode: full
          - name: android14-5.15.167
            kernel_version: "5.15.167"
            urls: >-
              https://android.googlesource.com/kernel/common
              https://github.com/aosp-mirror/kernel_common.git
              https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/kernel/common.git
            ref: android14-5.15.167_r00
            config: gki_defconfig
            cc: "LLVM=-17"
            llvmver: "17"
            mode: full
          - name: android14-6.1
            kernel_version: ""
            urls: >-
              https://github.com/aosp-mirror/kernel_common.git
              https://android.googlesource.com/kernel/common
            ref: android14-6.1
            config: gki_defconfig
            cc: "LLVM=-17"
            llvmver: "17"
            mode: modpost
          - name: android15-6.6
            kernel_version: "6.6.66"
            urls: >-
              https://github.com/aosp-mirror/kernel_common.git
              https://android.googlesource.com/kernel/common
            ref: android15-6.6.66_r00
            config: gki_defconfig
            cc: "LLVM=-18"
            llvmver: "18"
            mode: modpost
          - name: android16-6.12.69
            kernel_version: "6.12.69"
            urls: >-
              https://android.googlesource.com/kernel/common
              https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/kernel/common.git
            ref: android16-6.12.69_r00
            config: gki_defconfig
            cc: "LLVM=-19"
            llvmver: "19"
            mode: modpost
          - name: android17-6.18.21
            kernel_version: "6.18.21"
            urls: >-
              https://android.googlesource.com/kernel/common
              https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/kernel/common.git
            # 清华源与 AOSP 都没有 android17-6.18.21_r00 这个 release tag
            # （只有 .24 / .32 / .33），只能按 commit 取；两个源都实测支持按 SHA fetch。
            sha: f957accaf5634f841071adb4f35286ef2779d5b1
            config: gki_defconfig
            cc: "LLVM=-21"
            llvmver: "21"
            mode: modpost

    steps:
      - name: Checkout driver source
        uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc flex bison \
            libssl-dev libelf-dev \
            dwarves libdwarf-dev kmod \
            wget gnupg
          # GKI 内核强制 CONFIG_CC_IS_CLANG, 不能用 gcc 交叉编译。
          # 按版本装 LLVM: 5.10 -> clang-14, 5.15 -> clang-17, 6.1 -> 17, 6.6 -> 18,
          # 6.12 -> clang-19, 6.18 -> clang-21 (对齐 Android 工具链)。
          # 用 ubuntu-22.04 是因为 apt.llvm.org 的 noble 源只有 17/18/19/21，
          # jammy 才有 clang-14 / clang-17；5.10 用 14 编译。
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          if [ -n "${{ matrix.llvmver }}" ]; then
            sudo /tmp/llvm.sh "${{ matrix.llvmver }}" all
          fi

      - name: Clone kernel source
        run: |
          SHA="${{ matrix.sha }}"
          REF="${{ matrix.ref }}"
          ok=0
          for u in ${{ matrix.urls }}; do
            echo "===== 源: $u ====="
            for i in 1 2 3; do
              rm -rf kernel-src
              if [ -n "$SHA" ]; then
                git init -q kernel-src
                git -C kernel-src remote add origin "$u"
                # googlesource / 清华都支持按 SHA 浅取；GitHub 镜像会报 not our ref
                if timeout 900 git -C kernel-src -c http.version=HTTP/1.1 \
                     -c http.postBuffer=524288000 fetch --depth 1 origin "$SHA"; then
                  if git -C kernel-src checkout -q FETCH_HEAD; then ok=1; fi
                fi
              else
                if timeout 900 git -c http.version=HTTP/1.1 -c http.postBuffer=524288000 \
                     clone --depth 1 --branch "$REF" "$u" kernel-src; then
                  ok=1
                fi
              fi
              [ "$ok" = "1" ] && break
              echo "  第 $i 次失败，退避 $((i * 15))s 后重试"
              sleep $((i * 15))
            done
            if [ "$ok" = "1" ]; then echo "拉取成功: $u"; break; fi
            echo "!! 这个源拿不到，换下一个"
          done
          if [ "$ok" != "1" ]; then echo "!! 所有源都失败"; exit 1; fi

          echo "== 源码版本 =="
          GOT=$(awk -F'= *' '/^VERSION /{a=$2} /^PATCHLEVEL /{b=$2} /^SUBLEVEL /{c=$2} END{print a"."b"."c}' kernel-src/Makefile)
          echo "$GOT"
          git -C kernel-src log --oneline -1
          WANT="${{ matrix.kernel_version }}"
          if [ -n "$WANT" ] && [ "$GOT" != "$WANT" ]; then
            echo "!! 版本不符：期望 $WANT，实际 $GOT"
            exit 1
          fi

      - name: Configure kernel
        run: |
          cd kernel-src
          make ARCH=arm64 ${{ matrix.cc }} CROSS_COMPILE=aarch64-linux-gnu- ${{ matrix.config }}

      - name: Enable required configs
        run: |
          cd kernel-src
          ./scripts/config \
            --enable CONFIG_KPROBES \
            --enable CONFIG_KRETPROBES \
            --enable CONFIG_PERF_EVENTS \
            --enable CONFIG_HW_BREAKPOINT \
            --enable CONFIG_MISC_DEVICES \
            --disable CONFIG_AUTOFDO_CLANG \
            --enable CONFIG_DEBUG_INFO_BTF \
            --enable CONFIG_DEBUG_INFO_BTF_MODULES \
            --disable CONFIG_HEADERS_INSTALL \
            --disable CONFIG_GENDWARFKSYMS \
            --disable CONFIG_MEM_ALLOC_PROFILING \
            || true
          make ARCH=arm64 ${{ matrix.cc }} CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Prepare kernel modules
        run: |
          cd kernel-src
          echo "== Wind-Tomie =="
          if [ -n "${{ matrix.llvmver }}" ]; then
            clang-${{ matrix.llvmver }} --version | head -1
          else
            aarch64-linux-gnu-gcc --version | head -1
          fi
          make ARCH=arm64 ${{ matrix.cc }} CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" -O modules_prepare \
            > /tmp/prepare.log 2>&1 \
            || { echo "=== prepare FAILED, tail 120 lines ==="; tail -120 /tmp/prepare.log; exit 1; }

      - name: Get Module.symvers
        run: |
          cd kernel-src
          # 方案 G: 自编译 vmlinux.symvers (genksyms CRC)。CRC 只由 C 声明决定，
          # 与 LTO / CFI / 编译器版本无关，和内核同源，直接拿来当 Module.symvers。
          #
          # 5.10 / 5.15 的顶层 Makefile 没有 `PHONY += modpost`，`make modpost` 会报
          # No rule to make target，symvers 只能由完整构建产出，所以这两行走 full。
          if [ "${{ matrix.mode }}" = "full" ]; then
            make ARCH=arm64 ${{ matrix.cc }} CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" modules \
              || echo "!! 完整构建非零退出，先看有没有 symvers"
            if [ -s vmlinux.symvers ]; then
              cp vmlinux.symvers Module.symvers
              echo "取自 vmlinux.symvers"
            elif [ -s Module.symvers ]; then
              echo "取自根 Module.symvers"
            else
              echo "!! 没有产出 symvers"; exit 1
            fi
          else
            make ARCH=arm64 ${{ matrix.cc }} CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" modpost
            test -s vmlinux.symvers
            cp vmlinux.symvers Module.symvers
          fi
          # 不按 abi 白名单过滤：5.10 / 5.15 的 prebuilt 目录里根本没有
          # abi_symbollist（5.10 叫 abi_symbol_list，5.15 两个都没有），
          # 而且驱动要用的 register_kprobe / filp_open 也不在冻结 ABI 表里。
          test -s Module.symvers
          wc -l Module.symvers

      - name: Verify config & module_layout CRC
        run: |
          cd kernel-src
          echo "== CFI/LTO 状态 (必须 CFI_CLANG=y) =="
          grep -E "CONFIG_CFI_CLANG|CONFIG_LTO_CLANG|CONFIG_LTO_CLANG_THIN" .config || echo "!! CFI/LTO 未启用"
          echo "== module_layout 在 Module.symvers 里的 CRC =="
          grep -E "module_layout" Module.symvers || echo "!! module_layout 不在 Module.symvers"
          echo "== 关键符号 =="
          for sym in register_kprobe unregister_kprobe filp_open kernel_read; do
            if grep -qE "^[^[:space:]]+[[:space:]]+$sym[[:space:]]" Module.symvers; then
              echo "  $sym OK"
            else
              echo "  $sym 缺"
            fi
          done

      - name: Build wind module
        run: |
          mkdir -p kernel-src/drivers/wind
          cp -r kernel/* kernel-src/drivers/wind/
          cd kernel-src
          make ARCH=arm64 ${{ matrix.cc }} CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" M=drivers/wind modules

      - name: Show module info
        run: |
          file kernel-src/drivers/wind/wind.ko
          modinfo kernel-src/drivers/wind/wind.ko || true
          ls -lh kernel-src/drivers/wind/wind.ko

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: wind-${{ matrix.name }}
          path: kernel-src/drivers/wind/wind.ko
          if-no-files-found: error
