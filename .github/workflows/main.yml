name: build-wind-ko

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mainline-6.1
            repo: gregkh/linux
            ref: v6.1.112
            config: defconfig
            prebuild: ""
            cc: ""
            llvmver: ""
          - name: mainline-6.6
            repo: gregkh/linux
            ref: v6.6.57
            config: defconfig
            prebuild: ""
            cc: ""
            llvmver: ""
          - name: android16-6.12
            repo: aosp-mirror/kernel_common
            ref: android16-6.12
            config: gki_defconfig
            prebuild: ""
            cc: "LLVM=-19"
            llvmver: "19"
          - name: android17-6.18
            repo: aosp-mirror/kernel_common
            ref: android17-6.18
            config: gki_defconfig
            prebuild: ""
            cc: "LLVM=-21"
            llvmver: "21"

    steps:
      - name: Checkout driver source
        uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc flex bison \
            libssl-dev libelf-dev \
            dwarves libdwarf-dev kmod \
            wget gnupg
          # GKI 内核强制 CONFIG_CC_IS_CLANG, 不能用 gcc 交叉编译。
          # 按版本装 LLVM: 6.12 -> clang-19, 6.18 -> clang-21 (对齐 Android 工具链)。
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          if [ -n "${{ matrix.llvmver }}" ]; then
            sudo /tmp/llvm.sh "${{ matrix.llvmver }}" all
          fi

      - name: Clone kernel source
        run: |
          git clone --depth 1 --branch "${{ matrix.ref }}" \
            "https://github.com/${{ matrix.repo }}.git" kernel-src

      - name: Configure kernel
        run: |
          cd kernel-src
          make ARCH=arm64 ${{ matrix.cc }} CROSS_COMPILE=aarch64-linux-gnu- ${{ matrix.config }}

      - name: Enable required configs
        run: |
          cd kernel-src
          ./scripts/config \
            --enable CONFIG_KPROBES \
            --enable CONFIG_KRETPROBES \
            --enable CONFIG_PERF_EVENTS \
            --enable CONFIG_HW_BREAKPOINT \
            --enable CONFIG_MISC_DEVICES \
            --enable CONFIG_KALLSYMS \
            --enable CONFIG_KALLSYMS_ALL \
            --enable CONFIG_KALLSYMS_LOOKUP_NAME \
            --disable CONFIG_LTO_CLANG \
            --disable CONFIG_LTO_CLANG_THIN \
            --disable CONFIG_CFI_CLANG \
            --disable CONFIG_AUTOFDO_CLANG \
            --disable CONFIG_DEBUG_INFO_BTF \
            --disable CONFIG_HEADERS_INSTALL \
            --disable CONFIG_GENDWARFKSYMS \
            || true
          make ARCH=arm64 ${{ matrix.cc }} CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Prepare kernel modules
        run: |
          cd kernel-src
          echo "== CC =="
          if [ -n "${{ matrix.llvmver }}" ]; then
            clang-${{ matrix.llvmver }} --version | head -1
          else
            aarch64-linux-gnu-gcc --version | head -1
          fi
          make ARCH=arm64 ${{ matrix.cc }} CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" -O modules_prepare \
            > /tmp/prepare.log 2>&1 \
            || { echo "=== prepare FAILED, tail 120 lines ==="; tail -120 /tmp/prepare.log; exit 1; }

      - name: Get Module.symvers
        run: |
          cd kernel-src
          if [ -n "${{ matrix.prebuild }}" ]; then
            # GKI: 从官方 prebuilt .ko 提取冻结 KMI CRC (等价官方 Module.symvers)
            git clone --depth 1 \
              "https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/kernel/prebuilts/${{ matrix.prebuild }}/arm64/" \
              /tmp/gki-prebuilt
            # 内联提取脚本, 不依赖仓库根目录的 extract_symvers.py 是否被提交
            cat > /tmp/extract_symvers.py <<'PY'
          import struct, sys, os, glob

          def extract_versions(ko_path):
              try:
                  d = open(ko_path, 'rb').read()
              except OSError:
                  return []
              if len(d) < 64 or d[:4] != b'\x7fELF':
                  return []
              try:
                  e_shoff = struct.unpack('<Q', d[0x28:0x30])[0]
                  e_shentsize = struct.unpack('<H', d[0x3a:0x3c])[0]
                  e_shnum = struct.unpack('<H', d[0x3c:0x3e])[0]
                  e_shstrndx = struct.unpack('<H', d[0x3e:0x40])[0]
              except struct.error:
                  return []
              if e_shnum == 0 or e_shoff + e_shnum * e_shentsize > len(d):
                  return []
              shs = [d[e_shoff + i * e_shentsize : e_shoff + (i + 1) * e_shentsize]
                     for i in range(e_shnum)]
              if e_shstrndx >= len(shs):
                  return []
              shstr = shs[e_shstrndx]
              shstr_off = struct.unpack('<Q', shstr[0x18:0x20])[0]
              shstr_size = struct.unpack('<Q', shstr[0x20:0x28])[0]
              shstr = d[shstr_off:shstr_off + shstr_size]

              def sname(o):
                  e = shstr.index(b'\x00', o)
                  return shstr[o:e].decode('utf-8', 'replace')

              out = []
              for sh in shs:
                  if sname(struct.unpack('<I', sh[0:4])[0]) != '__versions':
                      continue
                  off = struct.unpack('<Q', sh[0x18:0x20])[0]
                  sz = struct.unpack('<Q', sh[0x20:0x28])[0]
                  sec = d[off:off + sz]
                  pos = 0
                  while pos + 8 <= len(sec):
                      crc = struct.unpack('<I', sec[pos:pos + 4])[0]
                      ns = pos + 8
                      if ns >= len(sec):
                          break
                      end = sec.find(b'\x00', ns, min(ns + 56, len(sec)))
                      if end == -1:
                          end = min(ns + 56, len(sec))
                      nm = sec[ns:end].decode('utf-8', 'replace')
                      if nm and crc != 0 and all(32 <= ord(c) < 127 or c == '.' for c in nm):
                          out.append((nm, crc))
                      pos += 64
                  return out
              return []

          prebuilt_dir = sys.argv[1]
          out_path = sys.argv[2] if len(sys.argv) > 2 else 'Module.symvers'
          kos = sorted(glob.glob(os.path.join(prebuilt_dir, '*.ko')))
          print('[+] %d .ko files' % len(kos), file=sys.stderr)
          symvers = {}
          for ko in kos:
              for name, crc in extract_versions(ko):
                  symvers.setdefault(name, crc)
          print('[+] %d unique symbols' % len(symvers), file=sys.stderr)
          with open(out_path, 'w') as f:
              for name, crc in sorted(symvers.items()):
                  f.write('0x%08x\t%s\tvmlinux\tEXPORT_SYMBOL\t\n' % (crc, name))
          print('[+] wrote %s' % out_path, file=sys.stderr)
          PY
            python3 /tmp/extract_symvers.py /tmp/gki-prebuilt ./Module.symvers
          else
            # 主线: make modpost 生成 vmlinux.symvers
            make ARCH=arm64 ${{ matrix.cc }} CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" modpost
            cp vmlinux.symvers Module.symvers
          fi
          test -s Module.symvers
          wc -l Module.symvers

      - name: Build wind module
        run: |
          mkdir -p kernel-src/drivers/wind
          cp -r kernel/* kernel-src/drivers/wind/
          cd kernel-src
          make ARCH=arm64 ${{ matrix.cc }} CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" M=drivers/wind modules

      - name: Show module info
        run: |
          file kernel-src/drivers/wind/wind.ko
          modinfo kernel-src/drivers/wind/wind.ko || true
          ls -lh kernel-src/drivers/wind/wind.ko

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: wind-${{ matrix.name }}
          path: kernel-src/drivers/wind/wind.ko
          if-no-files-found: error
