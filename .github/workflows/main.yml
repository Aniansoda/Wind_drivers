name: build-wind-ko

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: android13-5.10.226
            kernel_version: "5.10.226"
            urls: >-
              https://android.googlesource.com/kernel/common
              https://github.com/aosp-mirror/kernel_common.git
              https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/kernel/common.git
            ref: android13-5.10.226_r00
            config: gki_defconfig
            cc: "LLVM=1"
            llvmver: "14"
            llvm_unprefixed: "1"
            no_lto: "1"
            mode: full
          - name: android12-5.10.198
            kernel_version: "5.10.198"
            urls: >-
              https://android.googlesource.com/kernel/common
              https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/kernel/common.git
            ref: android12-5.10.198_r00
            config: gki_defconfig
            cc: "LLVM=1"
            llvmver: "14"
            llvm_unprefixed: "1"
            no_lto: "1"
            mode: full
          - name: android14-5.15.167
            kernel_version: "5.15.167"
            urls: >-
              https://android.googlesource.com/kernel/common
              https://github.com/aosp-mirror/kernel_common.git
              https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/kernel/common.git
            ref: android14-5.15.167_r00
            config: gki_defconfig
            cc: "LLVM=1"
            llvmver: "17"
            llvm_unprefixed: "1"
            no_lto: "1"
            mode: full
          - name: android13-5.15.149
            kernel_version: "5.15.149"
            urls: >-
              https://android.googlesource.com/kernel/common
              https://github.com/aosp-mirror/kernel_common.git
              https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/kernel/common.git
            ref: android13-5.15.149_r00
            config: gki_defconfig
            cc: "LLVM=1"
            llvmver: "14"
            llvm_unprefixed: "1"
            no_lto: "1"
            mode: full
          - name: android14-6.1
            kernel_version: ""
            urls: >-
              https://github.com/aosp-mirror/kernel_common.git
              https://android.googlesource.com/kernel/common
            ref: android14-6.1
            config: gki_defconfig
            cc: "LLVM=-17"
            llvmver: "17"
            mode: modpost
          - name: android15-6.6
            kernel_version: "6.6.66"
            urls: >-
              https://github.com/aosp-mirror/kernel_common.git
              https://android.googlesource.com/kernel/common
            ref: android15-6.6.66_r00
            config: gki_defconfig
            cc: "LLVM=-18"
            llvmver: "18"
            mode: modpost
          # 真机 OP6547L1 (6.12.58-android16-6-g7704a1ae279b-ab15213644-4k)
          #   config    : 设备 /proc/config.gz 原样, 放在 tools/device/config/
          #   vermagic  : 用 CONFIG_LOCALVERSION 强制成设备同一串
          #   strict_crc: 编出来的 CRC 必须与设备 454 个 vendor ko harvest 的表 100% 一致, 否则失败
          #               (一致 ⇒ 源码+config 与真机同构, 不需要任何 CRC 手术)
          - name: android16-6.12.58-device
            kernel_version: "6.12.58"
            device_sha: "7704a1ae279b"
            device_vermagic_prefix: "6.12.58-android16-6-g7704a1ae279b-ab15213644-4k"
            urls: >-
              https://android.googlesource.com/kernel/common
              https://github.com/aosp-mirror/kernel_common.git
              https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/kernel/common.git
            ref: android16-6.12.58_r00
            config: ""
            config_file: tools/device/config/android16-6.12.58-device.config
            # 不想把 480 KB 设备产物塞进仓库时: 传 windpack-*.tar.gz 的直链(Release/对象存储),
            # 下面 Fetch 步骤会自动解出 config + harvest CRC 表
            device_pack_url: ""
            localversion: "-android16-6-g7704a1ae279b-ab15213644-4k"
            strict_crc: "1"
            cc: "LLVM=-19"
            llvmver: "19"
            mode: modpost
          - name: android16-6.12.69
            kernel_version: "6.12.69"
            urls: >-
              https://android.googlesource.com/kernel/common
              https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/kernel/common.git
            ref: android16-6.12.69_r00
            config: gki_defconfig
            cc: "LLVM=-19"
            llvmver: "19"
            mode: modpost
          - name: android17-6.18.21
            kernel_version: "6.18.21"
            urls: >-
              https://android.googlesource.com/kernel/common
              https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/kernel/common.git
            sha: f957accaf5634f841071adb4f35286ef2779d5b1
            config: gki_defconfig
            cc: "LLVM=-21"
            llvmver: "21"
            mode: modpost

    steps:
      - name: Checkout driver source
        uses: actions/checkout@v4

      - name: Prepare device artifacts (repo tarball / URL / files)
        run: |
          CFG="${{ matrix.config_file }}"
          SYM="tools/device/symvers/${{ matrix.name }}.symvers"
          URL="${{ matrix.device_pack_url }}"
          [ -n "$CFG" ] || exit 0
          have() { [ -f "$CFG" ] && [ -f "$SYM" ]; }
          mkdir -p "$(dirname "$CFG")" "$(dirname "$SYM")"

          if have; then
            echo "== 仓库里已带设备产物 =="
            ls -l "$CFG" "$SYM"
            exit 0
          fi

          # 1) 仓库根放的小包 device-artifacts-*.tar.gz（内部是 tools/device/... 路径）
          for T in device-artifacts-*.tar.gz tools/device-artifacts-*.tar.gz; do
            if [ -f "$T" ]; then
              echo "== 解开仓库里的 $T =="
              tar xzf "$T"
            fi
          done
          if have; then
            ls -l "$CFG" "$SYM"
            exit 0
          fi

          # 2) 需要设备包：优先仓库/工作区里的 windpack，其次 device_pack_url
          PACK=""
          for P in windpack-*.tar.gz device-pack-*.tar.gz tools/windpack-*.tar.gz; do
            if [ -f "$P" ]; then PACK="$P"; break; fi
          done
          if [ -z "$PACK" ]; then
            if [ -z "$URL" ]; then
              echo "::error::没有设备产物: 仓库根放 device-artifacts-*.tar.gz 或 windpack-*.tar.gz, 或设 device_pack_url"
              exit 1
            fi
            echo "== 下载设备包 $URL =="
            curl -fL --retry 3 --connect-timeout 20 -o /tmp/pack.tgz "$URL"
            PACK=/tmp/pack.tgz
          fi

          echo "== 用设备包 $PACK 提取 config + CRC 表 =="
          mkdir -p /tmp/dp
          tar xzf "$PACK" -C /tmp/dp
          if [ ! -f "$CFG" ]; then
            SRC=$(find /tmp/dp -maxdepth 2 -name 'config.gz' | head -1)
            [ -n "$SRC" ] || { echo "::error::设备包里没有 config.gz"; exit 1; }
            if gzip -t "$SRC" 2>/dev/null; then zcat "$SRC" > "$CFG"; else cp "$SRC" "$CFG"; fi
            echo "config 行数: $(wc -l < "$CFG")"
          fi
          if [ ! -f "$SYM" ]; then
            FIRST=""
            for c in mods-vendor_dlkm.tar.gz mods-vendor.tar.gz; do
              if [ -f "/tmp/dp/$c" ]; then FIRST="/tmp/dp/$c"; break; fi
            done
            [ -n "$FIRST" ] || FIRST=$(ls /tmp/dp/mods-*.tar.gz 2>/dev/null | head -1)
            if [ -n "$FIRST" ]; then
              echo "== 解开模块包 $(basename "$FIRST") =="
              tar xzf "$FIRST" -C /tmp/dp
            fi
            N=$(find /tmp/dp -name '*.ko' | wc -l)
            echo "设备包里 .ko: $N 个"
            if [ "$N" -lt 50 ]; then echo "::error::设备包里 ko 太少($N), CRC 表不可信"; exit 1; fi
            python3 tools/dump_kcrc.py harvest "$SYM" $(find /tmp/dp -name '*.ko')
          fi
          ls -l "$CFG" "$SYM"

      - name: Preflight device artifacts
        run: |
          CFG="${{ matrix.config_file }}"
          SYM="tools/device/symvers/${{ matrix.name }}.symvers"
          want_sym="${{ matrix.strict_crc }}"
          [ -n "$CFG" ] || exit 0
          miss=0
          if [ ! -f "$CFG" ]; then
            echo "::error::缺少真机 config: $CFG"
            miss=1
          fi
          if [ -n "$want_sym" ] && [ ! -f "$SYM" ]; then
            echo "::error::缺少真机 CRC 表: $SYM"
            miss=1
          fi
          if [ "$miss" = "1" ]; then
            echo "两个文件都是**设备产物**, 必须随仓库一起推上去(或设 device_pack_url 走外链):"
            echo "  zcat config.gz > $CFG"
            echo "  python3 tools/dump_kcrc.py harvest $SYM \$(find /tmp/devmods -name '*.ko')"
            echo "  来源: 设备 /proc/config.gz 与 /vendor_dlkm/lib/modules/*.ko"
            exit 1
          fi
          ls -l "$CFG" "$SYM" 2>/dev/null || true

      - name: Add swap (LTO 兜底)
        run: |
          if [ ! -f /swapfile ]; then
            sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile > /dev/null
            sudo swapon /swapfile
          fi
          free -m
          swapon --show || true
          df -h / | tail -1

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc flex bison \
            libssl-dev libelf-dev \
            dwarves libdwarf-dev kmod \
            wget gnupg
            
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          if [ -n "${{ matrix.llvmver }}" ]; then
            sudo /tmp/llvm.sh "${{ matrix.llvmver }}" all
          fi

      - name: Expose unprefixed LLVM tools (5.x only)
        if: ${{ matrix.llvm_unprefixed == '1' }}
        run: |
          V="${{ matrix.llvmver }}"
          BIN="/usr/lib/llvm-$V/bin"
          if [ ! -d "$BIN" ]; then
            echo "!! 找不到 $BIN，先确认 llvm.sh $V 装成功"
            ls -d /usr/lib/llvm-* 2>/dev/null || true
            exit 1
          fi
          sudo mkdir -p /usr/local/llvm-shim
          for t in clang clang++ ld.lld lld llvm-ar llvm-nm llvm-objcopy llvm-objdump \
                   llvm-readelf llvm-strip llvm-size llvm-ranlib llvm-as llvm-dis \
                   llvm-link llvm-addr2line llvm-profdata; do
            if [ -x "$BIN/$t" ]; then
              sudo ln -sf "$BIN/$t" "/usr/local/llvm-shim/$t"
            else
              echo "  跳过 $t（$BIN 下没有）"
            fi
          done
          echo "/usr/local/llvm-shim" >> "$GITHUB_PATH"
          export PATH="/usr/local/llvm-shim:$PATH"
          echo "== 无前缀工具自检 =="
          which clang ld.lld llvm-ar
          clang --version | head -1
          ld.lld --version

      - name: Clone kernel source
        run: |
          SHA="${{ matrix.sha }}"
          REF="${{ matrix.ref }}"
          ok=0
          for u in ${{ matrix.urls }}; do
            echo "===== 源: $u ====="
            for i in 1 2 3; do
              rm -rf kernel-src
              if [ -n "$SHA" ]; then
                git init -q kernel-src
                git -C kernel-src remote add origin "$u"
                if timeout 900 git -C kernel-src -c http.version=HTTP/1.1 \
                     -c http.postBuffer=524288000 fetch --depth 1 origin "$SHA"; then
                  if git -C kernel-src checkout -q FETCH_HEAD; then ok=1; fi
                fi
              else
                if timeout 900 git -c http.version=HTTP/1.1 -c http.postBuffer=524288000 \
                     clone --depth 1 --branch "$REF" "$u" kernel-src; then
                  ok=1
                fi
              fi
              [ "$ok" = "1" ] && break
              echo "  第 $i 次失败，退避 $((i * 15))s 后重试"
              sleep $((i * 15))
            done
            if [ "$ok" = "1" ]; then echo "拉取成功: $u"; break; fi
            echo "!! 这个源拿不到，换下一个"
          done
          if [ "$ok" != "1" ]; then echo "!! 所有源都失败"; exit 1; fi

          echo "== 源码版本 =="
          GOT=$(awk -F'= *' '/^VERSION /{a=$2} /^PATCHLEVEL /{b=$2} /^SUBLEVEL /{c=$2} END{print a"."b"."c}' kernel-src/Makefile)
          echo "$GOT"
          git -C kernel-src log --oneline -1
          WANT="${{ matrix.kernel_version }}"
          if [ -n "$WANT" ] && [ "$GOT" != "$WANT" ]; then
            echo "!! 版本不符：期望 $WANT，实际 $GOT"
            exit 1
          fi

      - name: Configure kernel
        run: |
          cd kernel-src
          CFG="${{ matrix.config_file }}"
          if [ -n "$CFG" ]; then
            echo "== 用真机 config 当种子: $CFG =="
            cp "$GITHUB_WORKSPACE/$CFG" .config
            make ARCH=arm64 ${{ matrix.cc }} CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          else
            make ARCH=arm64 ${{ matrix.cc }} CROSS_COMPILE=aarch64-linux-gnu- ${{ matrix.config }}
          fi

      - name: Enable required configs
        run: |
          cd kernel-src
          ./scripts/config \
            --enable CONFIG_KPROBES \
            --enable CONFIG_KRETPROBES \
            --enable CONFIG_PERF_EVENTS \
            --enable CONFIG_HW_BREAKPOINT \
            --enable CONFIG_MISC_DEVICES \
            --disable CONFIG_AUTOFDO_CLANG \
            --enable CONFIG_DEBUG_INFO_BTF \
            --enable CONFIG_DEBUG_INFO_BTF_MODULES \
            --disable CONFIG_HEADERS_INSTALL \
            --disable CONFIG_GENDWARFKSYMS \
            --disable CONFIG_MEM_ALLOC_PROFILING \
            --disable CONFIG_WERROR \
            || true
          if [ -n "${{ matrix.config_file }}" ]; then
            # 真机 config 带 oplus 的 MODULE_SIG_PROTECT / MODULE_SIG_ALL,
            # ACK 里没有这些符号, olddefconfig 会丢; 这里显式关掉签名, 免得 CI 卡在生成密钥。
            ./scripts/config \
              --disable CONFIG_MODULE_SIG_ALL \
              --disable CONFIG_MODULE_SIG_FORCE \
              --disable CONFIG_CFI_PERMISSIVE \
              --disable CONFIG_WERROR \
              || true
            LV="${{ matrix.localversion }}"
            if [ -n "$LV" ]; then
              ./scripts/config --set-str CONFIG_LOCALVERSION "$LV" --disable CONFIG_LOCALVERSION_AUTO
            fi
            echo "== 强制 LOCALVERSION = $LV (LOCALVERSION_AUTO=n) =="
          fi
          if [ "${{ matrix.no_lto }}" = "1" ]; then
            ./scripts/config \
              --disable CONFIG_LTO \
              --disable CONFIG_LTO_CLANG \
              --disable CONFIG_LTO_CLANG_THIN \
              --disable CONFIG_LTO_CLANG_FULL \
              --disable CONFIG_CFI_CLANG \
              --disable CONFIG_CFI_ICALL_NORMALIZE_INTEGERS \
              || true
          fi
          make ARCH=arm64 ${{ matrix.cc }} CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          echo "== 关键配置 =="
          grep -E "^CONFIG_(LTO|LTO_CLANG|LTO_CLANG_THIN|LTO_CLANG_FULL|CFI_CLANG|WERROR|DEBUG_INFO_BTF|KPROBES)[= ]" .config || true

      - name: Prepare kernel modules
        run: |
          cd kernel-src
          echo "== Wind-Tomie =="
          if [ -n "${{ matrix.llvmver }}" ]; then
            clang-${{ matrix.llvmver }} --version | head -1
          else
            aarch64-linux-gnu-gcc --version | head -1
          fi
          make ARCH=arm64 ${{ matrix.cc }} CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" -O modules_prepare \
            > /tmp/prepare.log 2>&1 \
            || { echo "=== prepare FAILED, tail 120 lines ==="; tail -120 /tmp/prepare.log; exit 1; }

      - name: Get Module.symvers
        run: |
          cd kernel-src

          if [ "${{ matrix.mode }}" = "full" ]; then
            make ARCH=arm64 ${{ matrix.cc }} CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" modules \
              || echo "!! 完整构建非零退出，先看有没有 symvers"
            if [ -s vmlinux.symvers ]; then
              cp vmlinux.symvers Module.symvers
              echo "取自 vmlinux.symvers"
            elif [ -s Module.symvers ]; then
              echo "取自根 Module.symvers"
            else
              echo "!! 没有产出 symvers"; exit 1
            fi
          else
            make ARCH=arm64 ${{ matrix.cc }} CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" modpost
            test -s vmlinux.symvers
            cp vmlinux.symvers Module.symvers
          fi
          
          test -s Module.symvers
          wc -l Module.symvers

      - name: Merge device CRCs (if provided)
        run: |
          cd kernel-src
          SRC="../tools/device/symvers/${{ matrix.name }}.symvers"
          [ -f "$SRC" ] || SRC="../tools/device-symvers/${{ matrix.name }}.symvers"
          if [ -f "$SRC" ]; then
            cp Module.symvers /tmp/self.symvers
            echo "== 先比一次: 自建 vs 真机 (strict_crc=${{ matrix.strict_crc }}) =="
            set +e
            python3 ../tools/dump_kcrc.py diff /tmp/self.symvers "$SRC" | tee /tmp/crc_diff.txt
            set -e
            if [ -n "${{ matrix.strict_crc }}" ]; then
              if ! grep -q "cmd == 'count'" ../tools/dump_kcrc.py; then
                echo "::error::../tools/dump_kcrc.py 是旧版(没有 count 子命令), 把仓库里这份一起更新后再跑"
                exit 1
              fi
              # count 子命令直接给 "不一致数 交集数", 不依赖日志文案
              COUNTS=$(python3 ../tools/dump_kcrc.py count /tmp/self.symvers "$SRC")
              BAD=${COUNTS%% *}; COMMON=${COUNTS##* }
              echo "交集 $COMMON 个符号, 不一致 $BAD 个"
              if [ "${COMMON:-0}" -lt 50 ]; then
                echo "::error::真机 CRC 表只对上台 $COMMON 个符号, 表本身或 ko 都不对"
                exit 1
              fi
              if [ "$BAD" != "0" ]; then
                echo "::error::真机 CRC 有 $BAD/$COMMON 个符号对不上 —— 源码/config 与设备不同构, 不许发包"
                grep -A40 '不一致清单' /tmp/crc_diff.txt || true
                exit 1
              fi
              echo "[OK] 自建 CRC 与真机 $COMMON 个交集符号 100% 一致, 不需要 merge"
            fi
            echo "== 用设备 crc 覆盖: $SRC =="
            python3 ../tools/dump_kcrc.py merge Module.symvers "$SRC" /tmp/merged.symvers
            mv /tmp/merged.symvers Module.symvers
            echo "== 合并后 module_layout =="
            grep -m1 module_layout Module.symvers
          else
            echo "没有 $SRC，直接用自建 crc（只在纯 GKI 机型上能加载）"
          fi

      - name: Verify config & module_layout CRC
        run: |
          cd kernel-src
          echo "== CFI/LTO 状态 (必须 CFI_CLANG=y) =="
          grep -E "CONFIG_CFI_CLANG|CONFIG_LTO_CLANG|CONFIG_LTO_CLANG_THIN" .config || echo "!! CFI/LTO 未启用"
          echo "== module_layout 在 Module.symvers 里的 CRC =="
          grep -E "module_layout" Module.symvers || echo "!! module_layout 不在 Module.symvers"
          echo "== 关键符号 =="
          for sym in register_kprobe unregister_kprobe filp_open kernel_read; do
            if grep -qE "^[^[:space:]]+[[:space:]]+$sym[[:space:]]" Module.symvers; then
              echo "  $sym OK"
            else
              echo "  $sym 缺"
            fi
          done

      - name: Verify config matches device (layout critical)
        if: ${{ matrix.config_file }}
        run: |
          cd kernel-src
          DEV="$GITHUB_WORKSPACE/${{ matrix.config_file }}"
          bad=0
          # 这几个直接决定结构体布局 / 非法间接调用会不会 trap: 任何一项与真机不同都不许发包
          for k in CFI_CLANG CFI_ICALL_NORMALIZE_INTEGERS CFI_PERMISSIVE \
                   LTO_NONE RANDSTRUCT_NONE RANDSTRUCT_FULL \
                   ANDROID_VENDOR_HOOKS ANDROID_KABI_RESERVE ANDROID_VENDOR_OEM_DATA \
                   ARM64_MTE ARM64_PTR_AUTH ARM64_PAN SHADOW_CALL_STACK \
                   TASKS_RCU VMAP_STACK THREAD_INFO_IN_TASK SCHED_INFO PSI \
                   KASAN KASAN_HW_TAGS UBSAN UBSAN_TRAP KPROBES PERF_EVENTS \
                   MODVERSIONS EXTENDED_MODVERSIONS SMP PREEMPT THREAD_SIZE_ORDER \
                   ARM64_64K_PAGES; do
            a=$(grep -E "^CONFIG_${k}=" .config | head -1 | cut -d= -f2-)
            b=$(grep -E "^CONFIG_${k}=" "$DEV" | head -1 | cut -d= -f2-)
            [ -n "$a" ] || a="n"; [ -n "$b" ] || b="n"
            if [ "$a" = "$b" ]; then
              echo "  $k = $a"
            else
              echo "::error::$k 不一致: 本树=$a 真机=$b"
              bad=1
            fi
          done
          echo "== LOCALVERSION =="
          grep -E '^CONFIG_LOCALVERSION' .config
          exit $bad

      - name: Verify kernel source set
        run: |
          # 上一次是 memory.c 更新了、memory.h 没跟上 -> 编译期 no member named 'tr_hits'。
          # 这里在编译前把「同一版」直接验一遍: 缺文件硬失败, 版本不一致给出告警。
          missing=0
          for f in memory.c memory.h comm.h entry.c nlcomm.c sym.c; do
            if [ ! -f "kernel/$f" ]; then
              echo "::error::缺少 kernel/$f, 仓库 source 不完整"
              missing=1
            fi
          done
          if grep -q 'tr_hits' kernel/memory.c && ! grep -q 'WIND_HAVE_TR_STATS' kernel/memory.h; then
            echo "::warning::memory.h 落后于 memory.c: 翻译统计会缺两项 (功能不受影响, 但 windbench 看不到 tr_hits)"
          fi
          exit $missing

      - name: Build wind module
        run: |
          mkdir -p kernel-src/drivers/wind
          cp -r kernel/* kernel-src/drivers/wind/
          cd kernel-src
          make ARCH=arm64 ${{ matrix.cc }} CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" M=drivers/wind modules

      - name: Show module info
        run: |
          KM=kernel-src/drivers/wind/wind.ko
          file "$KM"
          modinfo "$KM" || true
          ls -lh "$KM"
          WANT="${{ matrix.device_vermagic_prefix }}"
          if [ -n "$WANT" ]; then
            GOT=$(modinfo -F vermagic "$KM" | awk '{print $1}')
            echo "vermagic 版本段: $GOT  (真机 $WANT)"
            if [ "$GOT" != "$WANT" ]; then
              echo "::error::vermagic 与真机不一致, 装上去会被拒或崩"
              exit 1
            fi
          fi
          echo "== 真机 CRC 表: $(wc -l < ../tools/device/symvers/${{ matrix.name }}.symvers 2>/dev/null || echo 缺失) 条 =="

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
