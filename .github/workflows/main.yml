name: build-wind-ko

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: android14-6.1
            repo: aosp-mirror/kernel_common
            ref: android14-6.1
            config: gki_defconfig
            prebuild: "6.1"
            prebuild_ref: "main"
            cc: "LLVM=-17"
            llvmver: "17"
          - name: android15-6.6
            repo: aosp-mirror/kernel_common
            ref: android15-6.6.118_r1
            config: gki_defconfig
            prebuild: "6.6"
            prebuild_ref: "main"
            cc: "LLVM=-18"
            llvmver: "18"
          - name: android16-6.12
            repo: aosp-mirror/kernel_common
            ref: android16-6.12
            config: gki_defconfig
            prebuild: "6.12"
            prebuild_ref: "main"
            cc: "LLVM=-19"
            llvmver: "19"
          - name: android17-6.18
            repo: aosp-mirror/kernel_common
            ref: android17-6.18
            config: gki_defconfig
            prebuild: "6.18"
            prebuild_ref: "android17-release"
            cc: "LLVM=-21"
            llvmver: "21"

    steps:
      - name: Checkout driver source
        uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc flex bison \
            libssl-dev libelf-dev \
            dwarves libdwarf-dev kmod \
            wget gnupg
          # GKI 内核强制 CONFIG_CC_IS_CLANG, 不能用 gcc 交叉编译。
          # 按版本装 LLVM: 6.12 -> clang-19, 6.18 -> clang-21 (对齐 Android 工具链)。
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          if [ -n "${{ matrix.llvmver }}" ]; then
            sudo /tmp/llvm.sh "${{ matrix.llvmver }}" all
          fi

      - name: Clone kernel source
        run: |
          git clone --depth 1 --branch "${{ matrix.ref }}" \
            "https://github.com/${{ matrix.repo }}.git" kernel-src

      - name: Configure kernel
        run: |
          cd kernel-src
          make ARCH=arm64 ${{ matrix.cc }} CROSS_COMPILE=aarch64-linux-gnu- ${{ matrix.config }}

      - name: Enable required configs
        run: |
          cd kernel-src
          ./scripts/config \
            --enable CONFIG_KPROBES \
            --enable CONFIG_KRETPROBES \
            --enable CONFIG_PERF_EVENTS \
            --enable CONFIG_HW_BREAKPOINT \
            --enable CONFIG_MISC_DEVICES \
            --disable CONFIG_AUTOFDO_CLANG \
            --disable CONFIG_DEBUG_INFO_BTF \
            --disable CONFIG_HEADERS_INSTALL \
            --disable CONFIG_GENDWARFKSYMS \
            --disable CONFIG_MEM_ALLOC_PROFILING \
            || true
          make ARCH=arm64 ${{ matrix.cc }} CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Prepare kernel modules
        run: |
          cd kernel-src
          echo "== CC =="
          if [ -n "${{ matrix.llvmver }}" ]; then
            clang-${{ matrix.llvmver }} --version | head -1
          else
            aarch64-linux-gnu-gcc --version | head -1
          fi
          make ARCH=arm64 ${{ matrix.cc }} CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" -O modules_prepare \
            > /tmp/prepare.log 2>&1 \
            || { echo "=== prepare FAILED, tail 120 lines ==="; tail -120 /tmp/prepare.log; exit 1; }

      - name: Get Module.symvers
        run: |
          cd kernel-src
          # 方案 G: 自编译 vmlinux.symvers (genksyms CRC), 再用 abi_symbollist 白名单过滤。
          # genksyms CRC 由源码 C 声明决定, 与 LTO/CFI/编译器版本无关,
          # 对白名单符号等于 GKI 冻结 CRC。
          # 旧方案 (官方 .ko 的 __versions 提取) 不完整 —— 缺白名单内但官方
          # prebuilt .ko 未实际引用的符号 (register_kprobe / file_path / mas_find 等),
          # 导致 modpost 把这些白名单符号误报为 undefined。
          make ARCH=arm64 ${{ matrix.cc }} CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" modpost
          test -s vmlinux.symvers
          cp vmlinux.symvers /tmp/full.symvers
          if [ -n "${{ matrix.prebuild }}" ]; then
            # GKI: 从官方 prebuilt 获取 abi_symbollist 白名单 (每行一个符号名)
            git clone --depth 1 --branch "${{ matrix.prebuild_ref }}" \
              "https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/kernel/prebuilts/${{ matrix.prebuild }}/arm64/" \
              /tmp/gki-prebuilt
            test -s /tmp/gki-prebuilt/abi_symbollist
            # 只保留白名单符号的 CRC; 模块引用白名单外符号会在 modpost 暴露 undefined
            awk 'NR==FNR { whitelist[$1]=1; next } ($2 in whitelist) { print }' \
              /tmp/gki-prebuilt/abi_symbollist /tmp/full.symvers > Module.symvers
          else
            # 主线: 不过滤
            cp /tmp/full.symvers Module.symvers
          fi
          test -s Module.symvers
          wc -l Module.symvers

      - name: Verify config & module_layout CRC
        run: |
          cd kernel-src
          echo "== CFI/LTO 状态 (必须 CFI_CLANG=y) =="
          grep -E "CONFIG_CFI_CLANG|CONFIG_LTO_CLANG|CONFIG_LTO_CLANG_THIN" .config || echo "!! CFI/LTO 未启用"
          echo "== module_layout 在 Module.symvers 里的 CRC =="
          grep -E "module_layout" Module.symvers || echo "!! module_layout 不在 Module.symvers"
          echo "== module_layout 是否在白名单 =="
          grep -c '^module_layout$' /tmp/gki-prebuilt/abi_symbollist || echo "!! 不在 abi_symbollist"

      - name: Build wind module
        run: |
          mkdir -p kernel-src/drivers/wind
          cp -r kernel/* kernel-src/drivers/wind/
          cd kernel-src
          make ARCH=arm64 ${{ matrix.cc }} CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" M=drivers/wind modules

      - name: Show module info
        run: |
          file kernel-src/drivers/wind/wind.ko
          modinfo kernel-src/drivers/wind/wind.ko || true
          ls -lh kernel-src/drivers/wind/wind.ko

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: wind-${{ matrix.name }}
          path: kernel-src/drivers/wind/wind.ko
          if-no-files-found: error
