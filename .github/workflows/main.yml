name: build-khack-ko

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Android GKI 分支 (gki_defconfig) ----
          # 只有 5.10 的 git prebuilt 直接发布 Module.symvers (CRC 和真机一致)。
          # 5.4/5.15/6.1/6.6 的 prebuilt 只发 abi 符号列表, 无 Module.symvers,
          # 暂退回自编译 vmlinux (CRC 对不上真机, 需 ci.android.com 按 build ID 下载符号表)。
          - name: android11-5.4
            repo: aosp-mirror/kernel_common
            ref: android11-5.4
            config: gki_defconfig
            prebuild: ""
          - name: android12-5.10
            repo: aosp-mirror/kernel_common
            ref: android12-5.10
            config: gki_defconfig
            prebuild: "5.10"
          - name: android13-5.15
            repo: aosp-mirror/kernel_common
            ref: android13-5.15
            config: gki_defconfig
            prebuild: ""
          - name: android14-6.1
            repo: aosp-mirror/kernel_common
            ref: android14-6.1
            config: gki_defconfig
            prebuild: ""
          - name: android15-6.6
            repo: aosp-mirror/kernel_common
            ref: android15-6.6
            config: gki_defconfig
            prebuild: ""
          # ---- 主线内核 (arm64 defconfig) ----
          # 主线无官方预构建符号表, 自编译 vmlinux 生成 Module.symvers。
          - name: mainline-6.12
            repo: torvalds/linux
            ref: v6.12
            config: defconfig
            prebuild: ""
          - name: mainline-6.18
            repo: torvalds/linux
            ref: v6.18
            config: defconfig
            prebuild: ""

    steps:
      - name: Checkout driver source
        uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc flex bison \
            libssl-dev libelf-dev \
            dwarves kmod

      - name: Clone kernel source
        run: |
          git clone --depth 1 --branch "${{ matrix.ref }}" \
            "https://github.com/${{ matrix.repo }}.git" kernel-src

      - name: Configure kernel
        run: |
          cd kernel-src
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- ${{ matrix.config }}

      - name: Enable required configs
        run: |
          cd kernel-src
          # 必要 config 兜底 (GKI/主线 defconfig 默认已开, 这里显式确保)
          ./scripts/config \
            --enable CONFIG_KPROBES \
            --enable CONFIG_KRETPROBES \
            --enable CONFIG_PERF_EVENTS \
            --enable CONFIG_HW_BREAKPOINT \
            --enable CONFIG_MISC_DEVICES || true
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Prepare kernel modules
        run: |
          cd kernel-src
          # 生成头文件 + modpost 工具 (不编译 vmlinux)
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" modules_prepare

      - name: Get Module.symvers
        run: |
          cd kernel-src
          if [ -n "${{ matrix.prebuild }}" ]; then
            # GKI: 下载 Google 预构建符号表 (CRC 和真机 GKI 一致, 才能 insmod)
            # 自编译 vmlinux 的符号表 CRC 对不上真机, 会报 "disagrees about version of symbol"
            git clone --depth 1 \
              "https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/kernel/prebuilts/${{ matrix.prebuild }}/arm64/" \
              /tmp/gki-prebuilt
            cp /tmp/gki-prebuilt/Module.symvers ./Module.symvers
          else
            # 主线/无预构建: make modpost 只生成符号表 (vmlinux.o + modpost),
            # 跳过 vmlinux 链接/BTF/kallsyms/SORTTAB (这些会拖时间且 SORTTAB 会失败)。
            # modpost 输出 vmlinux.symvers, 复制成 Module.symvers 供外部模块编译。
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" modpost
            cp vmlinux.symvers Module.symvers
          fi
          test -s Module.symvers
          wc -l Module.symvers

      - name: Build khack module
        run: |
          mkdir -p kernel-src/drivers/khack
          cp -r kernel/* kernel-src/drivers/khack/
          cd kernel-src
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" M=drivers/khack modules

      - name: Show module info
        run: |
          file kernel-src/drivers/khack/khack.ko
          modinfo kernel-src/drivers/khack/khack.ko || true
          ls -lh kernel-src/drivers/khack/khack.ko

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: khack-${{ matrix.name }}
          path: kernel-src/drivers/khack/khack.ko
          if-no-files-found: error
