name: build-wind-ko

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mainline-6.1
            repo: gregkh/linux
            ref: v6.1.112
            config: defconfig
            prebuild: ""
          - name: mainline-6.6
            repo: gregkh/linux
            ref: v6.6.57
            config: defconfig
            prebuild: ""
          - name: android16-6.12
            repo: aosp-mirror/kernel_common
            ref: android16-6.12
            config: gki_defconfig
            prebuild: "6.12"
          - name: android17-6.18
            repo: aosp-mirror/kernel_common
            ref: android17-6.18
            config: gki_defconfig
            prebuild: ""

    steps:
      - name: Checkout driver source
        uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc flex bison \
            libssl-dev libelf-dev \
            dwarves kmod

      - name: Clone kernel source
        run: |
          git clone --depth 1 --branch "${{ matrix.ref }}" \
            "https://github.com/${{ matrix.repo }}.git" kernel-src

      - name: Configure kernel
        run: |
          cd kernel-src
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- ${{ matrix.config }}

      - name: Enable required configs
        run: |
          cd kernel-src
          ./scripts/config \
            --enable CONFIG_KPROBES \
            --enable CONFIG_KRETPROBES \
            --enable CONFIG_PERF_EVENTS \
            --enable CONFIG_HW_BREAKPOINT \
            --enable CONFIG_MISC_DEVICES || true
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Prepare kernel modules
        run: |
          cd kernel-src
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" modules_prepare

      - name: Get Module.symvers
        run: |
          cd kernel-src
          if [ -n "${{ matrix.prebuild }}" ]; then
            # GKI: 从官方 prebuilt .ko 提取冻结 KMI CRC (等价官方 Module.symvers)
            git clone --depth 1 \
              "https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/kernel/prebuilts/${{ matrix.prebuild }}/arm64/" \
              /tmp/gki-prebuilt
            python3 ../extract_symvers.py /tmp/gki-prebuilt ./Module.symvers
          else
            # 主线: make modpost 生成 vmlinux.symvers
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" modpost
            cp vmlinux.symvers Module.symvers
          fi
          test -s Module.symvers
          wc -l Module.symvers

      - name: Build wind module
        run: |
          mkdir -p kernel-src/drivers/wind
          cp -r kernel/* kernel-src/drivers/wind/
          cd kernel-src
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" M=drivers/wind modules

      - name: Show module info
        run: |
          file kernel-src/drivers/wind/wind.ko
          modinfo kernel-src/drivers/wind/wind.ko || true
          ls -lh kernel-src/drivers/wind/wind.ko

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: wind-${{ matrix.name }}
          path: kernel-src/drivers/wind/wind.ko
          if-no-files-found: error
