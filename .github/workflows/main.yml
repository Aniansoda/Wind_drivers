name: build-wind-ko

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: android12-5.10.198
            kernel_version: "5.10.198"
            urls: >-
              https://android.googlesource.com/kernel/common
              https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/kernel/common.git
            ref: android12-5.10.198_r00
            zero_versions: "1"
            config: gki_defconfig
            cc: "LLVM=1"
            llvmver: "14"
            llvm_unprefixed: "1"
            no_lto: "1"
            mode: full
          - name: android13-5.15.149
            kernel_version: "5.15.149"
            urls: >-
              https://android.googlesource.com/kernel/common
              https://github.com/aosp-mirror/kernel_common.git
              https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/kernel/common.git
            ref: android13-5.15.149_r00
            zero_versions: "1"
            config: gki_defconfig
            cc: "LLVM=1"
            llvmver: "14"
            llvm_unprefixed: "1"
            no_lto: "1"
            mode: full
          - name: android14-6.1
            kernel_version: ""
            urls: >-
              https://github.com/aosp-mirror/kernel_common.git
              https://android.googlesource.com/kernel/common
            ref: android14-6.1
            zero_versions: "1"
            config: gki_defconfig
            cc: "LLVM=-17"
            llvmver: "17"
            mode: modpost
          - name: android15-6.6
            kernel_version: "6.6.66"
            urls: >-
              https://github.com/aosp-mirror/kernel_common.git
              https://android.googlesource.com/kernel/common
            ref: android15-6.6.66_r00
            zero_versions: "1"
            config: gki_defconfig
            cc: "LLVM=-18"
            llvmver: "18"
            mode: modpost
          - name: android16-6.12.58-device
            kernel_version: "6.12.58"
            device_sha: "7704a1ae279b"
            device_vermagic_prefix: "6.12.58-android16-6-g7704a1ae279b-ab15213644-4k"
            urls: >-
              https://android.googlesource.com/kernel/common
              https://github.com/aosp-mirror/kernel_common.git
              https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/kernel/common.git
            ref: android16-6.12.58_r00
            config: ""
            config_file: tools/device/config/android16-6.12.58-device.config
            localversion: "-android16-6-g7704a1ae279b-ab15213644-4k"
            zero_versions: "1"
            cc: "LLVM=-19"
            llvmver: "19"
            mode: modpost
          - name: android17-6.18.21
            kernel_version: "6.18.21"
            urls: >-
              https://android.googlesource.com/kernel/common
              https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/kernel/common.git
            sha: f957accaf5634f841071adb4f35286ef2779d5b1
            zero_versions: "1"
            config: gki_defconfig
            cc: "LLVM=-21"
            llvmver: "21"
            mode: modpost

    steps:
      - name: Checkout driver source
        uses: actions/checkout@v4

      - name: Check device config
        run: |
          CFG="${{ matrix.config_file }}"
          if [ -z "$CFG" ]; then
            echo "本行用 gki_defconfig, 不需要设备 config"
            exit 0
          fi
          if [ ! -f "$CFG" ]; then
            echo "::error::缺少设备 config: $CFG (零 CRC 路线只要它, 不再需要 CRC 表)"
            exit 1
          fi
          echo "设备 config: $CFG  $(wc -l < "$CFG") 行"
          grep -E '^CONFIG_(MODVERSIONS|EXTENDED_MODVERSIONS|ASM_MODVERSIONS|CFI_CLANG|SMP|PREEMPT)=' "$CFG" || true

      - name: Add swap (LTO 兜底)
        run: |
          if [ ! -f /swapfile ]; then
            sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile > /dev/null
            sudo swapon /swapfile
          fi
          free -m
          swapon --show || true
          df -h / | tail -1

      # ============================================================
      # 修复 1: runner 的 apt mirrorlist 指向已下线的 azure.archive.ubuntu.com
      #         并顺带修 DNS（整体解析失效时连 security.ubuntu.com 都会 Err）
      # ============================================================
      - name: Fix apt (server mirrorlist + DNS)
        run: |
          set -x
          echo "== 现状 =="
          cat /etc/resolv.conf || true
          ls -l /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null || true
          cat /etc/apt/apt-mirrors.txt 2>/dev/null || echo "(无 apt-mirrors.txt)"
          getent hosts archive.ubuntu.com || echo "DNS FAIL (before)"

          # 1) 干掉 runner 自定义的 mirrorlist 机制 —— azure.archive 的唯一来源
          sudo rm -f /etc/apt/apt-mirrors.txt
          sudo rm -f /etc/apt/apt.conf.d/*mirror* 2>/dev/null || true
          sudo rm -f /etc/apt/apt.conf.d/*proxy*  2>/dev/null || true

          # 2) 清空全部源定义, 写死官方源
          sudo rm -rf /etc/apt/sources.list.d/*
          sudo tee /etc/apt/sources.list >/dev/null <<'EOF'
          deb http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu jammy-backports main restricted universe multiverse
          deb http://security.ubuntu.com/ubuntu jammy-security main restricted universe multiverse
          EOF

          # 3) DNS
          echo -e "nameserver 8.8.8.8\nnameserver 1.1.1.1\nnameserver 168.63.129.16" \
            | sudo tee /etc/resolv.conf
          getent hosts archive.ubuntu.com || echo "DNS FAIL (after)"

          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 clean
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update

      # ============================================================
      # 修复 2: 主源失败自动退清华 / 阿里云，llvm.sh 也带重试
      # ============================================================
      - name: Install cross toolchain
        run: |
          APT_OPTS="-o Acquire::Retries=8 -o Acquire::http::Timeout=60 -o Acquire::ForceIPv4=true"
          PKGS="gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu bc flex bison libssl-dev libelf-dev dwarves libdwarf-dev kmod wget curl gnupg ca-certificates"

          if sudo apt-get $APT_OPTS install -y --no-install-recommends $PKGS; then
            echo "[OK] 官方源安装成功"
          else
            echo "!! 官方源失败, 切清华镜像"
            sudo sed -i \
              -e 's|http://archive.ubuntu.com/ubuntu|https://mirrors.tuna.tsinghua.edu.cn/ubuntu|g' \
              -e 's|http://security.ubuntu.com/ubuntu|https://mirrors.tuna.tsinghua.edu.cn/ubuntu|g' \
              /etc/apt/sources.list
            sudo apt-get $APT_OPTS clean
            sudo apt-get $APT_OPTS update || true
            if sudo apt-get $APT_OPTS install -y --no-install-recommends $PKGS; then
              echo "[OK] 清华源安装成功"
            else
              echo "!! 清华源失败, 切阿里云镜像"
              sudo sed -i \
                -e 's|https://mirrors.tuna.tsinghua.edu.cn/ubuntu|https://mirrors.aliyun.com/ubuntu|g' \
                /etc/apt/sources.list
              sudo apt-get $APT_OPTS clean
              sudo apt-get $APT_OPTS update || true
              sudo apt-get $APT_OPTS install -y --no-install-recommends $PKGS
              echo "[OK] 阿里云源安装成功"
            fi
          fi

          wget -qO /tmp/llvm.sh --tries=8 --timeout=60 --waitretry=5 \
            https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          if [ -n "${{ matrix.llvmver }}" ]; then
            sudo /tmp/llvm.sh "${{ matrix.llvmver }}" all
          fi

      - name: Expose unprefixed LLVM tools (5.x only)
        if: ${{ matrix.llvm_unprefixed == '1' }}
        run: |
          V="${{ matrix.llvmver }}"
          BIN="/usr/lib/llvm-$V/bin"
          if [ ! -d "$BIN" ]; then
            echo "!! 找不到 $BIN，先确认 llvm.sh $V 装成功"
            ls -d /usr/lib/llvm-* 2>/dev/null || true
            exit 1
          fi
          sudo mkdir -p /usr/local/llvm-shim
          for t in clang clang++ ld.lld lld llvm-ar llvm-nm llvm-objcopy llvm-objdump \
                   llvm-readelf llvm-strip llvm-size llvm-ranlib llvm-as llvm-dis \
                   llvm-link llvm-addr2line llvm-profdata; do
            if [ -x "$BIN/$t" ]; then
              sudo ln -sf "$BIN/$t" "/usr/local/llvm-shim/$t"
            else
              echo "  跳过 $t（$BIN 下没有）"
            fi
          done
          echo "/usr/local/llvm-shim" >> "$GITHUB_PATH"
          export PATH="/usr/local/llvm-shim:$PATH"
          echo "== 无前缀工具自检 =="
          which clang ld.lld llvm-ar
          clang --version | head -1
          ld.lld --version

      - name: Clone kernel source
        run: |
          SHA="${{ matrix.sha }}"
          REF="${{ matrix.ref }}"
          ok=0
          for u in ${{ matrix.urls }}; do
            echo "===== 源: $u ====="
            for i in 1 2 3; do
              rm -rf kernel-src
              if [ -n "$SHA" ]; then
                git init -q kernel-src
                git -C kernel-src remote add origin "$u"
                if timeout 900 git -C kernel-src -c http.version=HTTP/1.1 \
                     -c http.postBuffer=524288000 fetch --depth 1 origin "$SHA"; then
                  if git -C kernel-src checkout -q FETCH_HEAD; then ok=1; fi
                fi
              else
                if timeout 900 git -c http.version=HTTP/1.1 -c http.postBuffer=524288000 \
                     clone --depth 1 --branch "$REF" "$u" kernel-src; then
                  ok=1
                fi
              fi
              [ "$ok" = "1" ] && break
              echo "  第 $i 次失败，退避 $((i * 15))s 后重试"
              sleep $((i * 15))
            done
            if [ "$ok" = "1" ]; then echo "拉取成功: $u"; break; fi
            echo "!! 这个源拿不到，换下一个"
          done
          if [ "$ok" != "1" ]; then echo "!! 所有源都失败"; exit 1; fi

          echo "== 源码版本 =="
          GOT=$(awk -F'= *' '/^VERSION /{a=$2} /^PATCHLEVEL /{b=$2} /^SUBLEVEL /{c=$2} END{print a"."b"."c}' kernel-src/Makefile)
          echo "$GOT"
          git -C kernel-src log --oneline -1
          WANT="${{ matrix.kernel_version }}"
          if [ -n "$WANT" ] && [ "$GOT" != "$WANT" ]; then
            echo "!! 版本不符：期望 $WANT，实际 $GOT"
            exit 1
          fi

      - name: Configure kernel
        run: |
          cd kernel-src
          CFG="${{ matrix.config_file }}"
          if [ -n "$CFG" ]; then
            echo "== 用真机 config 当种子: $CFG =="
            cp "$GITHUB_WORKSPACE/$CFG" .config
            make ARCH=arm64 ${{ matrix.cc }} CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          else
            make ARCH=arm64 ${{ matrix.cc }} CROSS_COMPILE=aarch64-linux-gnu- ${{ matrix.config }}
          fi

      - name: Enable required configs
        run: |
          cd kernel-src
          ./scripts/config \
            --enable CONFIG_KPROBES \
            --enable CONFIG_KRETPROBES \
            --enable CONFIG_PERF_EVENTS \
            --enable CONFIG_HW_BREAKPOINT \
            --enable CONFIG_MISC_DEVICES \
            --disable CONFIG_AUTOFDO_CLANG \
            --enable CONFIG_DEBUG_INFO_BTF \
            --enable CONFIG_DEBUG_INFO_BTF_MODULES \
            --disable CONFIG_HEADERS_INSTALL \
            --disable CONFIG_GENDWARFKSYMS \
            --disable CONFIG_MEM_ALLOC_PROFILING \
            --disable CONFIG_WERROR \
            --disable CONFIG_TRIM_UNUSED_KSYMS \
            --set-str CONFIG_UNUSED_KSYMS_WHITELIST "" \
            --disable CONFIG_MODULE_SIG_PROTECT \
            --set-str CONFIG_MODULE_SIG_PROTECT_LIST "" \
            || true

          if [ -n "${{ matrix.config_file }}" ]; then
            ./scripts/config \
              --disable CONFIG_MODULE_SIG_ALL \
              --disable CONFIG_MODULE_SIG_FORCE \
              --disable CONFIG_CFI_PERMISSIVE \
              --disable CONFIG_WERROR \
              || true
            LV="${{ matrix.localversion }}"
            if [ -n "$LV" ]; then
              ./scripts/config --set-str CONFIG_LOCALVERSION "$LV" --disable CONFIG_LOCALVERSION_AUTO
            fi
            echo "== 强制 LOCALVERSION = $LV (LOCALVERSION_AUTO=n) =="
          fi
          if [ "${{ matrix.no_lto }}" = "1" ]; then
            ./scripts/config \
              --disable CONFIG_LTO \
              --disable CONFIG_LTO_CLANG \
              --disable CONFIG_LTO_CLANG_THIN \
              --disable CONFIG_LTO_CLANG_FULL \
              --disable CONFIG_CFI_CLANG \
              --disable CONFIG_CFI_ICALL_NORMALIZE_INTEGERS \
              || true
          fi
          make ARCH=arm64 ${{ matrix.cc }} CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          if grep -q '^CONFIG_TRIM_UNUSED_KSYMS=y' .config; then
            echo "::error::TRIM_UNUSED_KSYMS 还是 y, modpost 会去找 abi_symbollist.raw 然后失败"
            exit 1
          fi
          if grep -q '^CONFIG_MODULE_SIG_PROTECT=y' .config; then
            echo "::error::MODULE_SIG_PROTECT 还是 y, modpost 会去找 protected_module_names_list 然后失败"
            exit 1
          fi
          SPL=$(sed -n 's/^CONFIG_MODULE_SIG_PROTECT_LIST="\(.*\)"$/\1/p' .config)
          if [ -n "$SPL" ]; then
            echo "::error::MODULE_SIG_PROTECT_LIST 还是 \"$SPL\", modpost 会去找这个文件然后失败"
            exit 1
          fi
          echo "[OK] 签名保护名单已清空 (真机原值 protected_module_names_list, 裸树里没有这个文件)"
          echo "== 关键配置 =="
          grep -E "^CONFIG_(LTO|LTO_CLANG|LTO_CLANG_THIN|LTO_CLANG_FULL|CFI_CLANG|WERROR|DEBUG_INFO_BTF|KPROBES)[= ]" .config || true

      - name: Prepare kernel modules
        run: |
          cd kernel-src
          echo "== Wind-Tomie =="
          if [ -n "${{ matrix.llvmver }}" ]; then
            clang-${{ matrix.llvmver }} --version | head -1
          else
            aarch64-linux-gnu-gcc --version | head -1
          fi
          make ARCH=arm64 ${{ matrix.cc }} CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" -O modules_prepare \
            > /tmp/prepare.log 2>&1 \
            || { echo "=== prepare FAILED, tail 120 lines ==="; tail -120 /tmp/prepare.log; exit 1; }

      - name: Get Module.symvers
        run: |
          cd kernel-src
          if [ "${{ matrix.mode }}" = "full" ]; then
            make ARCH=arm64 ${{ matrix.cc }} CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" modules \
              || echo "!! 完整构建非零退出，先看有没有 symvers"
            if [ -s vmlinux.symvers ]; then
              cp vmlinux.symvers Module.symvers
              echo "取自 vmlinux.symvers"
            elif [ -s Module.symvers ]; then
              echo "取自根 Module.symvers"
            else
              echo "!! 没有产出 symvers"; exit 1
            fi
          else
            make ARCH=arm64 ${{ matrix.cc }} CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" modpost
            test -s vmlinux.symvers
            cp vmlinux.symvers Module.symvers
          fi
          test -s Module.symvers
          wc -l Module.symvers

      - name: Check CFI / module_layout / key symbols
        run: |
          cd kernel-src
          echo "== CFI/LTO 状态 (必须 CFI_CLANG=y) =="
          grep -E "CONFIG_CFI_CLANG|CONFIG_LTO_CLANG|CONFIG_LTO_CLANG_THIN" .config || echo "!! CFI/LTO 未启用"
          echo "== module_layout 在 Module.symvers 里的 CRC =="
          grep -E "module_layout" Module.symvers || echo "!! module_layout 不在 Module.symvers"
          echo "== 关键符号 =="
          for sym in register_kprobe unregister_kprobe filp_open kernel_read; do
            if grep -qE "^[^[:space:]]+[[:space:]]+$sym[[:space:]]" Module.symvers; then
              echo "  $sym OK"
            else
              echo "  $sym 缺"
            fi
          done

      - name: Verify config matches device (layout critical)
        if: ${{ matrix.config_file }}
        run: |
          cd kernel-src
          DEV="$GITHUB_WORKSPACE/${{ matrix.config_file }}"
          bad=0
          for k in CFI_CLANG CFI_ICALL_NORMALIZE_INTEGERS CFI_PERMISSIVE \
                   LTO_NONE RANDSTRUCT_NONE RANDSTRUCT_FULL \
                   ANDROID_VENDOR_HOOKS ANDROID_KABI_RESERVE ANDROID_VENDOR_OEM_DATA \
                   ARM64_MTE ARM64_PTR_AUTH ARM64_PAN SHADOW_CALL_STACK \
                   TASKS_RCU VMAP_STACK THREAD_INFO_IN_TASK SCHED_INFO PSI \
                   KASAN KASAN_HW_TAGS UBSAN UBSAN_TRAP KPROBES PERF_EVENTS \
                   MODVERSIONS EXTENDED_MODVERSIONS SMP PREEMPT THREAD_SIZE_ORDER \
                   ARM64_64K_PAGES; do
            a=$(grep -E "^CONFIG_${k}=" .config | head -1 | cut -d= -f2-)
            b=$(grep -E "^CONFIG_${k}=" "$DEV" | head -1 | cut -d= -f2-)
            [ -n "$a" ] || a="n"; [ -n "$b" ] || b="n"
            if [ "$a" = "$b" ]; then
              echo "  $k = $a"
            else
              echo "::error::$k 不一致: 本树=$a 真机=$b"
              bad=1
            fi
          done
          echo "== LOCALVERSION =="
          grep -E '^CONFIG_LOCALVERSION' .config
          exit $bad

      - name: Verify kernel source set
        run: |
          missing=0
          for f in memory.c memory.h comm.h entry.c nlcomm.c sym.c clonebp.c clonebp.h; do
            if [ ! -f "kernel/$f" ]; then
              echo "::error::缺少 kernel/$f, 仓库 source 不完整"
              missing=1
            fi
          done
          if grep -q 'tr_hits' kernel/memory.c && ! grep -q 'WIND_HAVE_TR_STATS' kernel/memory.h; then
            echo "::warning::memory.h 落后于 memory.c: 翻译统计会缺两项"
          fi
          exit $missing

      - name: Build wind module
        run: |
          mkdir -p kernel-src/drivers/wind
          cp -r kernel/* kernel-src/drivers/wind/
          cd kernel-src
          make ARCH=arm64 ${{ matrix.cc }} CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" M=drivers/wind modules

      - name: Zero __versions (no-CRC route)
        if: matrix.zero_versions
        run: |
          cd kernel-src
          KM=drivers/wind/wind.ko
          python3 ../tools/zero_versions.py "$KM"
          DEVICE_PREFIX="${{ matrix.device_vermagic_prefix }}" python3 - "$KM" <<'PY'
          import os, struct, sys
          p = sys.argv[1]
          prefix = os.environ.get('DEVICE_PREFIX', '')
          d = open(p, 'rb').read()
          shoff = struct.unpack_from('<Q', d, 0x28)[0]
          es = struct.unpack_from('<H', d, 0x3A)[0]
          n = struct.unpack_from('<H', d, 0x3C)[0]
          si = struct.unpack_from('<H', d, 0x3E)[0]
          so = struct.unpack_from('<Q', d, shoff + si * es + 24)[0]
          ss = struct.unpack_from('<Q', d, shoff + si * es + 32)[0]
          nm = d[so:so + ss]
          secs = {}
          for k in range(n):
              o = shoff + k * es
              no = struct.unpack_from('<I', d, o)[0]
              secs[nm[no:nm.index(b'\0', no)].decode('latin1')] = (
                  struct.unpack_from('<Q', d, o + 24)[0],
                  struct.unpack_from('<Q', d, o + 32)[0])
          if '__versions' not in secs:
              raise SystemExit('::error::没有 __versions 段; 这条路依赖它"存在但长度 0", 缺段只能 insmod -f')
          left = {k: v[1] for k, v in secs.items()
                  if (k == '__versions' or k.endswith('version_ext_crcs')
                      or k.endswith('version_ext_names')) and v[1] != 0}
          print('version 类段:', {k: v[1] for k, v in secs.items() if 'version' in k})
          if left:
              raise SystemExit('::error::段还没清零: %s' % left)
          off, size = secs['.modinfo']
          vm = [x for x in d[off:off + size].split(b'\0') if x.startswith(b'vermagic=')]
          if not vm:
              raise SystemExit('::error::.modinfo 里没有 vermagic')
          tail = vm[0].split(b' ', 1)[1] if b' ' in vm[0] else b''
          if prefix:
              if tail != b'SMP preempt mod_unload modversions aarch64':
                  raise SystemExit('::error::vermagic 尾巴不对: [%s]' % tail.decode())
          else:
              if b'modversions' not in tail or not tail.endswith(b'aarch64'):
                  raise SystemExit('::error::尾巴缺 modversions 或不是 aarch64: [%s]' % tail.decode())
          print('[OK] __versions 全 0 -> 内核整段跳过 CRC 比对')
          print('      %s' % vm[0].decode())
          PY

      - name: Show module info
        run: |
          KM=kernel-src/drivers/wind/wind.ko
          file "$KM"
          modinfo "$KM" || true
          ls -lh "$KM"
          WANT="${{ matrix.device_vermagic_prefix }}"
          if [ -z "$WANT" ] && [ -n "${{ matrix.zero_versions }}" ]; then
            VM=$(modinfo -F vermagic "$KM")
            TAIL=$(printf '%s' "$VM" | cut -d' ' -f2-)
            echo "零 CRC 路线(通用行): vermagic 尾巴 = [$TAIL]"
            case "$TAIL" in
              *modversions*aarch64*) echo "[OK] 尾巴带 modversions 且为 aarch64" ;;
              *) echo "::error::尾巴缺 modversions 或不是 aarch64: [$TAIL]"; exit 1 ;;
            esac
          fi
          if [ -n "$WANT" ]; then
            VM=$(modinfo -F vermagic "$KM")
            GOT=$(printf '%s' "$VM" | awk '{print $1}')
            TAIL=$(printf '%s' "$VM" | cut -d' ' -f2-)
            echo "vermagic 版本段: $GOT  (真机 $WANT)"
            if [ -n "${{ matrix.zero_versions }}" ]; then
              echo "零 CRC 路线: __versions 段存在 -> has_crcs=1, 内核只比尾巴"
              if [ "$TAIL" = "SMP preempt mod_unload modversions aarch64" ]; then
                echo "[OK] vermagic 尾巴匹配"
              else
                echo "::error::vermagic 尾巴不对: [$TAIL]"
                exit 1
              fi
            elif [ "$GOT" != "$WANT" ]; then
              echo "::error::vermagic 与真机不一致, 装上去会被拒或崩"
              exit 1
            fi
          fi
          echo "== 版本段长度 (零 CRC 路线要求全 0) =="
          readelf -SW "$KM" | grep -E "__versions|version_ext" || echo "  (没有版本段)"

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: wind-${{ matrix.name }}
          path: kernel-src/drivers/wind/wind.ko
          if-no-files-found: error
